<!DOCTYPE html>
<html lang="it">

<head>
    <title>Home</title>
    <link rel="shortcut icon" href="img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="default.css">
    <link rel="stylesheet" href="scrollbar.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top navbar-expand">
        <div class="container-fluid">
            <a class="navbar-brand">
                <img id="mode" src="img/moon.png" alt="Tema" onclick="switchMode()">
            </a>
            
            <ul class="navbar-nav me-auto">
                <li class="nav-item" id="home">
                    <a class="nav-link" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./documenti/documenti.html">Documenti</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./contatti/contatti.html">Contatti</a>
                </li>
            </ul>
                
            <span class="navbar-text" style="cursor: default">
                Con voi dal 2024
            </span>
        </div>
    </nav>

    <div class="container">
        <h1 class="ml3">
            Fondazione De Vincenzi
        </h1>

        <img id="logo" src="img/logo.png" alt="Logo">

        <h2>
            Motto
        </h2>
    </div>

    <div id="carousel" class="carousel slide">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/cuore.jpg" class="d-block w-100" alt="Cuore">
                <div class="carousel-caption d-md-block">
                    <h3>Chi siamo</h3>
                    <p>Breve descrizione</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/bussola.jpg" class="d-block w-100" alt="Bussola">
                <div class="carousel-caption d-md-block">
                    <h3>Cosa facciamo</h3>
                    <p>Breve descrizione</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/mani.jpg" class="d-block w-100" alt="Mani">
                <div class="carousel-caption d-md-block">
                    <h3>I nostri obiettivi</h3>
                    <p>Breve descrizione</p>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Prima</span>
        </button>
        
        <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Dopo</span>
        </button>
    </div>

    <script src="default.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
